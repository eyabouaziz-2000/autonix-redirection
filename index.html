<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer votre mot de passe</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #218838;
        }
        .error { color: #dc3545; margin-top: 10px; }
        .success { color: #28a745; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>Créer votre mot de passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
        <input type="password" id="password" placeholder="Nouveau mot de passe">
        <button onclick="savePassword()">Valider le mot de passe</button>
    </div>
    
    <div id="message" style="margin-top: 20px; font-weight: bold; text-align: center;"></div>

    <script>
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP'; 

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                detectSessionInUrl: false,
                persistSession: true
            }
        });

        async function savePassword() {
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const form = document.getElementById('form-container');

            // 🛑 Vérification 1 : Ken el password faregh, y7bes toul men ghir ma ycreyi chay!
            if (!password || password.trim() === "") {
                msg.textContent = "Veuillez entrer un mot de passe valide.";
                msg.className = 'error';
                return;
            }

            if (password.length < 6) {
                msg.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                msg.className = 'error';
                return;
            }

            try {
                msg.textContent = "Enregistrement en cours...";
                msg.className = '';

                let session = (await client.auth.getSession()).data.session;
                
                if (!session) {
                    const hash = window.location.hash;
                    if (hash && hash.includes('access_token')) {
                        const params = new URLSearchParams(hash.substring(1));
                        const accessToken = params.get('access_token');
                        const refreshToken = params.get('refresh_token');
                        
                        if (accessToken) {
                            const res = await client.auth.setSession({
                                access_token: accessToken,
                                refresh_token: refreshToken
                            });
                            session = res.data.session;
                        }
                    }
                }

                if (!session) {
                    throw new Error("Lien invalide ou expiré. Veuillez demander une nouvelle invitation.");
                }

                // 1. Mise à jour du mot de passe fel auth
                const { data: authData, error: authError } = await client.auth.updateUser({ password: password });
                if (authError) throw authError;

                const userId = authData.user.id;
                const userEmail = authData.user.email;

                // 2. Récupération des infos depuis pending_profiles
                let correctRole = 'operatrice';
                let userNom = null;
                let userPrenom = null;

                const { data: pendingData } = await client
                    .from('pending_profiles')
                    .select('role, nom, prenom')
                    .eq('email', userEmail)
                    .maybeSingle();

                if (pendingData) {
                    correctRole = pendingData.role;
                    userNom = pendingData.nom;
                    userPrenom = pendingData.prenom;
                }

                // 3. Insertion propre dans profiles KAN ba3d ma tsajel el mot de passe b naja7
                const { error: profileError } = await client.from('profiles').upsert({
                    id: userId,
                    username: userPrenom ? userPrenom.toLowerCase() : userEmail.split('@')[0],
                    nom: userNom,
                    role: correctRole,
                });

                if (profileError) throw profileError;

                // 4. Nettoyage de pending_profiles
                await client.from('pending_profiles').delete().eq('email', userEmail);

                // Succès total
                form.style.display = 'none';
                msg.textContent = "Mot de passe enregistré avec succès ! ✅";
                msg.className = 'success';

            } catch (err) {
                msg.textContent = "Erreur : " + err.message;
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
