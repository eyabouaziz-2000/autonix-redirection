<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Création du mot de passe</title>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #toggleBtn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button.submit-btn:hover { background-color: #218838; }
        #error-message {
            margin-top: 15px;
            font-size: 14px;
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>Créer votre mot de passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
        
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Mot de passe">
            <button type="button" id="toggleBtn" onclick="togglePass()">👁️</button>
        </div>
        
        <button class="submit-btn" onclick="savePassword()">Valider le mot de passe</button>
        <div id="error-message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP';

        // Initialisation de Supabase (détection automatique de la session de récupération dans l'URL)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                detectSessionInUrl: true,
                persistSession: true
            }
        });

        function togglePass() {
            const pwdInput = document.getElementById('password-input');
            const btn = document.getElementById('toggleBtn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                pwdInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        async function savePassword() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.innerText = "";

            // Récupère le nouveau mot de passe saisi par l'utilisateur
            const newPassword = document.getElementById('password-input').value;

            if (!newPassword || newPassword.length < 6) {
                errorMsg.innerText = "Erreur : Le mot de passe doit contenir au moins 6 caractères.";
                return;
            }

            try {
                errorMsg.innerText = "Enregistrement en cours...";

                // Met à jour l'utilisateur connecté via le lien de récupération
                const { data, error } = await supabase.auth.updateUser({
                  password: newPassword
                });

                if (error) {
                  // Affiche l'erreur si le lien est vraiment expiré ou invalide
                  errorMsg.innerText = "Erreur : " + error.message;
                } else {
                  // Succès ! Le mot de passe est mis à jour et l'utilisateur est authentifié
                  const user = data.user;
                  const userId = user.id;
                  const userEmail = user.email;

                  // Vérification si le profil existe déjà pour éviter les doublons
                  const { data: existingProfile } = await supabase
                      .from('profiles')
                      .select('id')
                      .eq('id', userId)
                      .maybeSingle();

                  if (!existingProfile) {
                      // Récupération des données depuis 'pending_profiles'
                      let correctRole = 'operatrice';
                      let userNom = null;
                      let userPrenom = null;

                      const { data: pendingData } = await supabase
                          .from('pending_profiles')
                          .select('role, nom, prenom')
                          .eq('email', userEmail)
                          .maybeSingle();

                      if (pendingData) {
                          correctRole = pendingData.role;
                          userNom = pendingData.nom;
                          userPrenom = pendingData.prenom;
                      }

                      // Bascule des données vers la table 'profiles' définitive
                      const { error: profileError } = await supabase.from('profiles').insert({
                          id: userId,
                          username: userPrenom ? userPrenom.toLowerCase() : userEmail.split('@')[0],
                          nom: userNom,
                          role: correctRole,
                      });

                      if (profileError) {
                          console.error("Erreur lors de l'insertion dans profiles :", profileError);
                      }
                  }

                  alert("Mot de passe créé avec succès !");
                  document.getElementById('form-container').style.display = 'none';
                }

            } catch (err) {
                errorMsg.innerText = "Erreur technique : " + err.message;
            }
        }
    </script>
</body>
</html>
