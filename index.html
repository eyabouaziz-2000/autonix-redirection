<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Création du mot de passe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        
        .password-container {
            position: relative;
            margin: 20px 0;
        }
        input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #28a745;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-size: 18px;
        }
        
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button.submit-btn:hover { background-color: #218838; }
        #message { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .error { color: #dc3545; }
        .success { color: #28a745; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Créer votre mot de passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
        
        <div id="form-container">
            <div class="password-container">
                <input type="password" id="password" placeholder="••••••••••">
                <button type="button" class="toggle-password" id="toggleBtn" onclick="togglePass()">👁️</button>
            </div>
            <button class="submit-btn" onclick="savePassword()">Valider le mot de passe</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP'; // Remplacez par votre clé anon

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Récupération de la session au chargement de la page via le token de l'URL
        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                const accessToken = new URLSearchParams(hash.substring(1)).get('access_token');
                if (accessToken) {
                    await client.auth.setSession({
                        access_token: accessToken,
                        refresh_token: new URLSearchParams(hash.substring(1)).get('refresh_token')
                    });
                }
            }
        });

        // Fonction pour l'œil (masquer / afficher)
        function togglePass() {
            const pwdInput = document.getElementById('password');
            const btn = document.getElementById('toggleBtn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                pwdInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Fonction pour enregistrer le mot de passe
        async function savePassword() {
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const form = document.getElementById('form-container');

            if (!password || password.length < 6) {
                msg.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                msg.className = 'error';
                return;
            }

            try {
                msg.textContent = "Enregistrement en cours...";
                msg.className = '';

                const { error } = await client.auth.updateUser({ password: password });

                if (error) throw error;

                // Succès : Le formulaire disparaît et le message s'affiche
                form.style.display = 'none';
                msg.textContent = "Mot de passe enregistré avec succès ! ✅";
                msg.className = 'success';

            } catch (err) {
                msg.textContent = "Erreur : " + err.message;
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
