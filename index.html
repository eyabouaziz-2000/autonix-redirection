<script>
    const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Récupérer automatiquement la session depuis l'URL dès le chargement de la page
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) console.error("Erreur session :", error.message);
        } catch (err) {
            console.error("Erreur :", err);
        }
    });

    async function setupAccount() {
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        if (!password || password.length < 6) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Le mot de passe doit contenir au moins 6 caractères.';
            return;
        }

        try {
            // S'assurer que la session est bien active avant de modifier le mot de passe
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            
            if (!session) {
                // Tentative manuelle si la session n'est pas détectée
                const hash = window.location.hash;
                const params = new URLSearchParams(hash.replace('#', '?'));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');

                if (!accessToken) {
                    throw new Error("Session introuvable. Veuillez recréer un utilisateur et refaire un test.");
                }

                await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });
            }

            // 1. Mettre à jour le mot de passe
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: password
            });
            if (updateError) throw updateError;

            // 2. Récupérer l'utilisateur connecté pour l'insérer dans les tables
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (user) {
                // Insérer dans la table des profils / gestion des utilisateurs
                await supabaseClient
                    .from('profiles')
                    .upsert({
                        id: user.id,
                        email: user.email,
                    });
            }

            messageEl.style.color = 'green';
            messageEl.innerText = 'Compte activé avec succès ! Vous pouvez fermer cette page.';
            document.getElementById('password').disabled = true;

        } catch (err) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Erreur : ' + err.message;
        }
    }
</script>
