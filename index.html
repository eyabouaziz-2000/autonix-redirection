<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Définition du mot de passe</title>
    <!-- Importation de Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Créer votre mot de passe x</h2>
    <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
    
    <input type="password" id="password" placeholder="Nouveau mot de passe" required>
    <button onclick="updatePassword()">Valider le mot de passe</button>
    
    <p id="message"></p>
</div>

<script>
    // Initialisez Supabase avec vos vraies clés (Remplacez par vos identifiants Supabase)
    const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function updatePassword() {
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        if (!password || password.length < 6) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Le mot de passe doit contenir au moins 6 caractères.';
            return;
        }

        try {
            // Récupère le token d'accès présent dans l'URL (après le #)
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');

            if (accessToken) {
                // Établit la session avec le token de l'e-mail
                await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });
            }

            // Met à jour le mot de passe de l'utilisateur dans Supabase
            const { data, error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) throw error;

            messageEl.style.color = 'green';
            messageEl.innerText = 'Mot de passe créé avec succès ! Vous pouvez fermer cette page et vous connecter dans l\'application.';
            
            // Optionnel : Désactiver le formulaire après succès
            document.getElementById('password').disabled = true;

        } catch (err) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Erreur : ' + err.message;
        }
    }
</script>

</body>
</html>
