<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Création du mot de passe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        
        .password-container {
            position: relative;
            margin: 20px 0;
        }
        input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #28a745;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: #666;
        }
        
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button.submit-btn:hover { background-color: #218838; }
        #message { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .error { color: #dc3545; }
        .success { color: #28a745; font-size: 16px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Créer votre mot de passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
        
        <div id="form-container">
            <div class="password-container">
                <input type="password" id="password" placeholder="Nouveau mot de passe (min. 6 caractères)" required>
                <button type="button" class="toggle-password" id="toggleBtn" onclick="togglePasswordVisibility()">
                    <!-- Icône Œil fermé par défaut -->
                    <svg id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </button>
            </div>
            <button class="submit-btn" onclick="updatePassword()">Valider le mot de passe</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        // Configuration de Supabase
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP'; // Mettez votre clé anon ici

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messageEl = document.getElementById('message');
        const formContainer = document.getElementById('form-container');

        // Vérifier s'il y a une erreur d'URL (comme un lien expiré / otp_expired) au chargement
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash.includes('error=access_denied') || hash.includes('otp_expired')) {
                formContainer.style.display = 'none';
                messageEl.textContent = "Erreur : Lien invalide ou expiré. Veuillez refaire une demande d'invitation depuis l'application.";
                messageEl.className = 'error';
            }
        });

        // Fonction pour afficher / cacher le mot de passe avec l'œil
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Icône œil barré (ou ouvert selon préférence)
                eyeIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.12c0-1.66-1.34-3-3-3l-.17.02z"/>';
            } else {
                passwordInput.type = 'password';
                // Icône œil normal
                eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        // Fonction pour valider et enregistrer le mot de passe
        async function updatePassword() {
            const password = document.getElementById('password').value;
            
            if (!password || password.length < 6) {
                messageEl.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                messageEl.className = 'error';
                return;
            }

            try {
                messageEl.textContent = "Enregistrement en cours...";
                messageEl.className = '';

                const { error } = await supabase.auth.updateUser({ password: password });

                if (error) throw error;

                // Affichage du message de succès exact demandé
                messageEl.textContent = "Mot de passe bien enregistré !";
                messageEl.className = 'success';
                formContainer.style.display = 'none';

            } catch (err) {
                console.error("Erreur :", err);
                messageEl.textContent = "Erreur : " + err.message;
                messageEl.className = 'error';
            }
        }
    </script>
</body>
</html>
