<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer votre mot de passe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="form-container">
        <h2>Définissez votre mot de passe</h2>
        <input type="password" id="password" placeholder="Votre mot de passe (min. 6 caractères)"><br><br>
        <button onclick="validerEtCreerCompte()">Enregistrer et valider</button>
    </div>
    <p id="message"></p>

    <script>
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KO6LvBlYmTOF-R5PO_nu_g_6fwwLrkP';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Récupérer l'e-mail depuis l'URL (ex: ?email=test@gmail.com)
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email');

        async function validerEtCreerCompte() {
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const form = document.getElementById('form-container');

            if (!userEmail) {
                msg.textContent = "Erreur : E-mail introuvable dans le lien.";
                return;
            }

            if (!password || password.length < 6) {
                msg.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                return;
            }

            try {
                msg.textContent = "Création du compte en cours...";

                // 1. Vérifier si l'e-mail existe bien dans 'pending_users' et récupérer son rôle
                const { data: pendingData, error: pendingError } = await client
                    .from('pending_users')
                    .select('*')
                    .eq('email', userEmail)
                    .maybeSingle();

                if (pendingError || !pendingData) {
                    throw new Error("Invitation invalide ou expirée.");
                }

                // 2. CRÉER LE COMPTE DANS SUPABASE AUTH (users) MAINTENANT
                // On met 'email_confirmed_at' implicitement validé puisque l'utilisateur a cliqué sur le lien
                const { data: authData, error: authError } = await client.auth.signUp({
                    email: userEmail,
                    password: password,
                    options: {
                        data: {
                            username: pendingData.username,
                            role: pendingData.role
                        }
                    }
                });

                if (authError) throw authError;

                const userId = authData.user.id;

                // 3. INSERER DANS LE TABLEAU 'profiles'
                const { error: profileError } = await client.from('profiles').upsert({
                    id: userId,
                    username: pendingData.username,
                    role: pendingData.role
                });

                if (profileError) throw profileError;

                // 4. SUPPRIMER DE LA TABLE 'pending_users' (il n'est plus en attente)
                await client
                    .from('pending_users')
                    .delete()
                    .eq('email', userEmail);

                // 5. SUCCÈS TOTAL
                form.style.display = 'none';
                msg.textContent = "Mot de passe enregistré avec succès ! Votre compte est créé. ✅";

            } catch (err) {
                msg.textContent = "Erreur : " + err.message;
            }
        }
    </script>
</body>
</html>
