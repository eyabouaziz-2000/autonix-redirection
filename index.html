<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Création de votre compte</title>
    <!-- Importation de Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Créer votre mot de passe</h2>
    <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
    
    <input type="password" id="password" placeholder="Nouveau mot de passe" required>
    <button onclick="setupAccount()">Valider le mot de passe</button>
    
    <p id="message"></p>
</div>

<script>
    // Initialisation de Supabase avec vos clés du projet
    const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_secret_E87EIr1BXGm0L_HEogwHsw_94KKtxj8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function setupAccount() {
        const password = document.getElementById('password').value;
        const messageEl = document.getElementById('message');

        if (!password || password.length < 6) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Le mot de passe doit contenir au moins 6 caractères.';
            return;
        }

        try {
            // 1. Récupérer le token d'accès dans l'URL
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');

            if (!accessToken) {
                throw new Error("Lien invalide ou expiré. Veuillez refaire une demande d'invitation.");
            }

            // 2. Établir la session Supabase sécurisée avec le token de l'e-mail
            const { data: sessionData, error: sessionError } = await supabaseClient.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });
            if (sessionError) throw sessionError;

            const user = sessionData.user;

            // 3. Mettre à jour et valider définitivement le mot de passe dans Supabase Auth
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: password
            });
            if (updateError) throw updateError;

            // 4. L'ÉCRITURE SE FAIT ICI : Le mot de passe est validé, on enregistre dans vos tables
            const { error: profileError } = await supabaseClient
                .from('profiles')
                .upsert({
                    id: user.id,
                    email: user.email,
                });

            if (profileError) console.error("Erreur table profiles :", profileError.message);

            // Message de succès affiché à l'utilisateur
            messageEl.style.color = 'green';
            messageEl.innerText = 'Compte activé avec succès ! Vous pouvez fermer cette page.';
            document.getElementById('password').disabled = true;

        } catch (err) {
            messageEl.style.color = 'red';
            messageEl.innerText = 'Erreur : ' + err.message;
        }
    }
</script>

</body>
</html>
