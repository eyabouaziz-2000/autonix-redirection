<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonix - Création du mot de passe</title>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #toggleBtn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button.submit-btn:hover { background-color: #218838; }
        #message {
            margin-top: 15px;
            font-size: 14px;
        }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card" id="form-container">
        <h2>Créer votre mot de passe</h2>
        <p>Veuillez entrer votre nouveau mot de passe ci-dessous :</p>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Mot de passe">
            <button type="button" id="toggleBtn" onclick="togglePass()">👁️</button>
        </div>
        
        <button class="submit-btn" onclick="savePassword()">Valider le mot de passe</button>
        <div id="message"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wvgamjabxcjmxfztuzkb.supabase.co';
        const SUPABASE_ANON_KEY = 'VOTRE_CLE_ANON_PUBLIQUE';

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                detectSessionInUrl: false,
                persistSession: true
            }
        });

        let storedAccessToken = null;
        let storedRefreshToken = null;

        // Capture des tokens au chargement sans les consommer
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                storedAccessToken = params.get('access_token');
                storedRefreshToken = params.get('refresh_token');
                
                // Nettoyage immédiat de l'URL pour garder les tokens en mémoire
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        function togglePass() {
            const pwdInput = document.getElementById('password');
            const btn = document.getElementById('toggleBtn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.textContent = '👁️‍🗨️';
            } else {
                pwdInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        async function savePassword() {
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const form = document.getElementById('form-container');

            // 1. VÉRIFICATION LOCALE DIRECTE : Si le MDP est faux/vide, on s'arrête net sans toucher au token !
            if (!password || password.length < 6) {
                msg.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
                msg.className = 'error';
                return;
            }

            try {
                msg.textContent = "Vérification en cours...";
                msg.className = '';

                let session = (await client.auth.getSession()).data.session;
                if (!session && storedAccessToken) {
                    const res = await client.auth.setSession({
                        access_token: storedAccessToken,
                        refresh_token: storedRefreshToken
                    });
                    session = res.data.session;
                }

                if (!session) {
                    throw new Error("Ce lien d'invitation n'est plus valide ou a expiré.");
                }

                const userId = session.user.id;
                const userEmail = session.user.email;

                // 2. VÉRIFICATION DANS PROFILES : Est-ce que le compte existe déjà ?
                const { data: existingProfile } = await client
                    .from('profiles')
                    .select('id')
                    .eq('id', userId)
                    .maybeSingle();

                if (existingProfile) {
                    form.style.display = 'none';
                    msg.textContent = "⚠️ Ce compte a déjà été utilisé et enregistré avec succès. Ce lien ne peut plus servir.";
                    msg.className = 'error';
                    return;
                }

                // 3. Mise à jour du mot de passe dans Supabase Auth
                const { data: authData, error: authError } = await client.auth.updateUser({ password: password });
                if (authError) throw authError;

                // 4. Récupération des infos depuis pending_profiles
                let correctRole = 'operatrice';
                let userNom = null;
                let userPrenom = null;

                const { data: pendingData } = await client
                    .from('pending_profiles')
                    .select('role, nom, prenom')
                    .eq('email', userEmail)
                    .maybeSingle();

                if (pendingData) {
                    correctRole = pendingData.role;
                    userNom = pendingData.nom;
                    userPrenom = pendingData.prenom;
                }

                // 5. Insertion définitive dans profiles (première fois)
                const { error: profileError } = await client.from('profiles').insert({
                    id: userId,
                    username: userPrenom ? userPrenom.toLowerCase() : userEmail.split('@')[0],
                    nom: userNom,
                    role: correctRole,
                });

                if (profileError) throw profileError;

                // Succès total
                form.style.display = 'none';
                msg.textContent = "Mot de passe enregistré avec succès ! ✅";
                msg.className = 'success';

            } catch (err) {
                msg.textContent = "Erreur : " + err.message;
                msg.className = 'error';
            }
        }
    </script>
</body>
</html>
